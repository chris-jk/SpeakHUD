<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Terminals">
<title>Terminals</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="top">
  <h1>Terminals</h1>
  <div class="switches">
    <label class="switch">
      <span>Away</span>
      <input type="checkbox" role="switch" id="away">
    </label>
    <label class="switch" id="speak-switch" hidden>
      <span>Read aloud</span>
      <input type="checkbox" role="switch" id="speak">
    </label>
    <button type="button" class="speed" id="speed" hidden>Speed 1×</button>
  </div>
</header>
<p class="says" id="away-says"></p>
<p class="says" id="speak-says" hidden></p>

<details class="fold" id="quick-edit">
  <summary>Quick answers</summary>
  <p class="says">One tap sends one of these to a terminal. Add the things you always say.</p>
  <ul class="quick-list" id="quick-list"></ul>
  <form class="quick-add" id="quick-add">
    <input type="text" id="quick-new" placeholder="A new quick answer" aria-label="A new quick answer" maxlength="200" enterkeyhint="done">
    <button type="submit">Add</button>
  </form>
</details>

<p class="trouble" id="trouble" hidden></p>

<main id="windows"></main>

<p class="empty" id="empty" hidden>No terminals open. Start Claude Code in iTerm2 on your Mac, or resume a session below.</p>

<details class="fold" id="old">
  <summary>Resume an old session</summary>
  <p class="says" id="old-says">Opens a new terminal on the Mac and picks the session back up.</p>
  <ul class="old-list" id="old-list"></ul>
</details>

<template id="window">
  <article class="win">
    <header class="win-bar">
      <h2 class="win-name"></h2>
      <span class="win-state"></span>
      <time class="win-when"></time>
      <span class="win-reading" hidden>
        <button type="button" class="win-over" aria-label="Start over" title="Start over">&#8635;</button>
        <button type="button" class="win-stop" aria-label="Stop" title="Stop">&#9632;</button>
      </span>
      <button type="button" class="win-read" hidden>Read</button>
    </header>
    <div class="win-body">
      <p class="win-status" hidden></p>
      <span class="win-cursor" aria-hidden="true"></span>
      <p class="win-text"></p>
      <button type="button" class="win-more" hidden>Show all of it</button>
      <div class="win-media" hidden></div>

      <section class="win-asks" hidden>
        <p class="win-tabs" hidden></p>
        <p class="win-question"></p>
        <div class="win-options"></div>
      </section>

      <p class="win-sent" hidden></p>
      <p class="win-note" hidden></p>

      <p class="win-working" hidden>Working<span class="win-working-track"><span></span></span></p>
      <div class="win-quick" hidden></div>
      <div class="win-pics" hidden></div>
      <form class="win-answer">
        <textarea rows="1" placeholder="Answer" enterkeyhint="send" autocapitalize="sentences" aria-label="Answer"></textarea>
        <button type="button" class="win-mic" aria-label="Dictate" hidden>
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15Z" fill="currentColor"/>
            <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <button type="button" class="win-pic" aria-label="Add a picture">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <rect x="3.5" y="5" width="17" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="9" cy="10" r="1.6" fill="currentColor"/>
            <path d="M4.5 17.5 9 13l3.5 3.5 2.5-2.5 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </button>
        <input type="file" class="win-file" accept="image/*" multiple hidden>
        <button type="submit">Send</button>
      </form>
      <p class="win-mic-says" hidden></p>

      <details class="win-screen">
        <summary>Its screen</summary>
        <pre class="win-pre" tabindex="0"></pre>
        <div class="win-keys">
          <button type="button" data-press="1">1</button>
          <button type="button" data-press="2">2</button>
          <button type="button" data-press="3">3</button>
          <button type="button" data-press="4">4</button>
          <button type="button" data-press="up" aria-label="Up">&#9650;</button>
          <button type="button" data-press="down" aria-label="Down">&#9660;</button>
          <button type="button" data-press="enter">Enter</button>
          <button type="button" data-press="esc">Esc</button>
        </div>
        <button type="button" class="win-close">Close this terminal</button>
      </details>
    </div>
  </article>
</template>

<script src="/app.js"></script>
</body>
</html>
